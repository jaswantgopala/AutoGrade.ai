services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autograde-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      PORT: 8080
      REDIS_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: autograde-redis
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    restart: unless-stopped
